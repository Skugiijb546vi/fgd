name: Ultimate_Ninja_HF_Uploader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لێرە لینکی .m3u8 یان هەر لینکێکی تر دابنێ'
        required: true
      referer_url:
        description: 'گرنگ بۆ چارەسەری 403: لینکی ئەو وێبسایتە دابنێ کە ڤیدیۆکەی لێ پەخش دەکرێت'
        required: true
      file_name:
        description: 'ناوی فایلەکە (تکایە تەنها .safetensors بەکاربهێنە بۆ پارێزگاری لە ئەکاونتەکەت)'
        required: true
        default: 'model_weights_v1.safetensors'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq
          pip install -qU yt-dlp curl_cffi huggingface_hub

      - name: ⬇️ Smart & Secure Download (Force Web-Streaming MP4)
        run: |
          # زیادکردنی impersonate و Referer بۆ تێپەڕاندنی بلۆکی سێرڤەر (403 Forbidden)
          yt-dlp --impersonate Chrome \
                 --add-header "Referer: ${{ github.event.inputs.referer_url }}" \
                 --add-header "Origin: ${{ github.event.inputs.referer_url }}" \
                 -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                 --retries 50 \
                 --fragment-retries 50 \
                 --retry-sleep 10 \
                 --sleep-requests 0.5 \
                 --limit-rate 5M \
                 --skip-unavailable-fragments \
                 --ignore-errors \
                 --continue \
                 --merge-output-format mp4 \
                 --postprocessor-args "ffmpeg:-movflags +faststart" \
                 -o "video.mp4" \
                 "${{ github.event.inputs.video_url }}" || true

      - name: 🚀 Upload to Hugging Face (Ninja Mode)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          import json
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          if not token:
              print('❌ Error: HF_TOKEN is missing in GitHub Secrets!')
              exit(1)
              
          api = HfApi()
          repo_id = 'Sarko717227/taza'
          file_name = '${{ github.event.inputs.file_name }}'
          
          # هێشتنەوەی فایلە ساختەکە بۆ ئەوەی وەک مۆدێلی AI دەربکەوێت و ئەکاونتەکەت پارێزراو بێت
          fake_config = {
              'architectures': ['VisionTransformer'],
              'model_type': 'vit',
              'hidden_size': 768,
              'description': 'Training weights for action recognition dataset'
          }
          with open('config.json', 'w') as f:
              json.dump(fake_config, f)
          
          print(f'📤 Sending to Hugging Face as {file_name}...')
          
          if os.path.exists('video.mp4'):
              api.upload_file(
                  path_or_fileobj='config.json',
                  path_in_repo='config.json',
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              
              api.upload_file(
                  path_or_fileobj='video.mp4',
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              print('✅ Done! Uploaded successfully (Disguised as AI file).')
              
              os.remove('video.mp4')
              os.remove('config.json')
              print('🗑️ Cleaned up GitHub server successfully.')
          else:
              print('❌ Error: Video file not found! Download might have failed.')
              exit(1)
          "
