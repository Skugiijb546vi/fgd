name: Ultimate_Ninja_HF_Uploader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لێرە لینکی .m3u8 یان هەر لینکێکی تر دابنێ'
        required: true
      referer_url:
        description: 'گرنگ: لینکی ئەو وێبسایتە دابنێ کە ڤیدیۆکەی لێ پەخش دەکرێت (بۆ نموونە: https://newlinehd.com/)'
        required: true
      file_name:
        description: 'ناوی فایلەکە (تکایە تەنها .safetensors بەکاربهێنە)'
        required: true
        default: 'model_weights_v1.safetensors'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq
          pip install -qU yt-dlp curl_cffi huggingface_hub

      - name: ⬇️ Smart & Secure Download (Force Web-Streaming MP4)
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          REFERER_URL: ${{ github.event.inputs.referer_url }}
        run: |
          # دەرهێنانی ناوی وێبسایتەکە بە شێوەیەکی ئۆتۆماتیکی بۆ ئەوەی لەسەر هەموو سایتێک کاربکات
          ORIGIN_URL=$(echo "$REFERER_URL" | grep -o '^https\?://[^/]\+')
          
          yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                 --add-header "Referer: $REFERER_URL" \
                 --add-header "Origin: $ORIGIN_URL" \
                 -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                 --retries 50 \
                 --fragment-retries 50 \
                 --retry-sleep 10 \
                 --sleep-requests 0.5 \
                 --limit-rate 5M \
                 --skip-unavailable-fragments \
                 --ignore-errors \
                 --continue \
                 --merge-output-format mp4 \
                 --postprocessor-args "ffmpeg:-movflags +faststart" \
                 -o "video.mp4" \
                 "$VIDEO_URL" || true

      - name: 🚀 Upload to Hugging Face (Ninja Mode)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
        run: |
          cat << 'EOF' > upload.py
          import os
          import json
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          if not token:
              print('❌ Error: HF_TOKEN is missing in GitHub Secrets!')
              exit(1)
              
          api = HfApi()
          repo_id = 'Sarko717227/taza'
          file_name = os.getenv('FILE_NAME', 'model_weights_v1.safetensors')
          
          fake_config = {
              'architectures': ['VisionTransformer'],
              'model_type': 'vit',
              'hidden_size': 768,
              'description': 'Training weights for action recognition dataset'
          }
          with open('config.json', 'w') as f:
              json.dump(fake_config, f)
          
          print(f'📤 Sending to Hugging Face as {file_name}...')
          
          if os.path.exists('video.mp4'):
              api.upload_file(
                  path_or_fileobj='config.json',
                  path_in_repo='config.json',
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              
              api.upload_file(
                  path_or_fileobj='video.mp4',
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              print('✅ Done! Uploaded successfully (Disguised as AI file).')
              
              os.remove('video.mp4')
              os.remove('config.json')
              print('🗑️ Cleaned up GitHub server successfully.')
          else:
              print('❌ Error: Video file not found! Download might have failed.')
              exit(1)
          EOF
          
          python3 upload.py
