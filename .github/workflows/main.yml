name: Ultimate_Universal_Ninja_Uploader

on:
  workflow_dispatch:
    inputs:
      media_link:
        description: 'لێرە لینکەکە دابنێ (Magnet, m3u8, یان mp4)'
        required: true
      referer_url:
        description: 'ئەگەر بۆ m3u8 پێویست بوو لینکی سایتەکە دابنێ (بۆ تۆرێنت بەتاڵی جێبهێڵە)'
        required: false
        default: ''
      file_name:
        description: 'ناوی فایلی ڤیدیۆکە (تکایە تەنها .safetensors بەکاربهێنە)'
        required: true
        default: 'model_weights_v3.safetensors'
      youtube_name:
        description: 'ناوی ئەو فایلەی بۆ یوتوب ئامادە دەکرێت (پێویستە .mp4 بێت)'
        required: true
        default: 'SEBAR_Tv_Subtitle_Track.mp4'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 ffmpeg -qq
          pip install -qU yt-dlp curl_cffi huggingface_hub

      - name: 🕵️‍♂️ Smart Universal Download (Auto-Detect)
        env:
          MEDIA_LINK: ${{ github.event.inputs.media_link }}
          REFERER_URL: ${{ github.event.inputs.referer_url }}
        run: |
          mkdir -p master_download
          cd master_download
          
          if [[ "$MEDIA_LINK" == magnet:?* ]]; then
              echo "🧲 دۆزرایەوە: لینکی ماگنێت (Torrent) - باری تایبەت بۆ فیلمی دەگمەن"
              aria2c --dir=. \
                     --seed-time=0 \
                     --summary-interval=10 \
                     --enable-dht=true \
                     --dht-listen-port=6881-6999 \
                     --bt-enable-lpd=true \
                     --enable-peer-exchange=true \
                     --bt-require-crypto=true \
                     --max-connection-per-server=16 \
                     --split=16 \
                     --min-split-size=1M \
                     --check-certificate=false \
                     --timeout=600 \
                     "$MEDIA_LINK"
          else
              echo "🌐 دۆزرایەوە: لینکی وێب (m3u8 یان mp4)"
              
              HEADER_ARGS=""
              if [ -n "$REFERER_URL" ]; then
                  ORIGIN_URL=$(echo "$REFERER_URL" | grep -o '^https\?://[^/]\+')
                  HEADER_ARGS="--add-header Referer:$REFERER_URL --add-header Origin:$ORIGIN_URL"
              fi
              
              yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                     $HEADER_ARGS \
                     -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                     --retries 50 \
                     --fragment-retries 50 \
                     --ignore-errors \
                     --continue \
                     --merge-output-format mp4 \
                     -o "video.mp4" \
                     "$MEDIA_LINK" || true
          fi

      - name: 🚀 Upload to Hugging Face (Ninja Mode & YouTube Prep)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
          YOUTUBE_NAME: ${{ github.event.inputs.youtube_name }}
        run: |
          cat << 'EOF' > upload.py
          import os
          import json
          import subprocess
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          if not token:
              print('❌ Error: HF_TOKEN is missing in GitHub Secrets!')
              exit(1)
              
          api = HfApi()
          repo_id = 'Sarko717227/taza'
          file_name = os.getenv('FILE_NAME', 'model_weights_v3.safetensors')
          youtube_name = os.getenv('YOUTUBE_NAME', 'SEBAR_Tv_Subtitle_Track.mp4')
          
          fake_config = {
              'architectures': ['VisionTransformer'],
              'model_type': 'vit',
              'hidden_size': 768,
              'description': 'Universal training weights dataset'
          }
          with open('config.json', 'w') as f:
              json.dump(fake_config, f)
          
          download_dir = 'master_download'
          largest_file = None
          max_size = 0
          
          for root, dirs, files in os.walk(download_dir):
              for file in files:
                  file_path = os.path.join(root, file)
                  size = os.path.getsize(file_path)
                  if size > max_size:
                      max_size = size
                      largest_file = file_path
                      
          if largest_file:
              print(f'🎥 Found largest video file: {largest_file} ({max_size / (1024*1024):.2f} MB)')
              
              print(f'🎵 Creating highly compressed YouTube-ready video: {youtube_name} ...')
              # فەرمانی دروستکردنی شاشەی ڕەش و فلتەرکردنی دەنگی ئەکتەرەکان
              cmd = [
                  'ffmpeg', '-f', 'lavfi', '-i', 'color=c=black:s=1280x720:r=1',
                  '-i', largest_file,
                  '-c:v', 'libx264', '-tune', 'stillimage', '-crf', '35',
                  '-map', '0:v', '-map', '1:a',
                  '-c:a', 'aac', '-b:a', '48k', '-ac', '1',
                  '-af', 'highpass=f=100,lowpass=f=4000',
                  '-shortest', '-pix_fmt', 'yuv420p', youtube_name
              ]
              subprocess.run(cmd)
              
              print('📤 Sending Original Video & Config to Hugging Face...')
              api.upload_file(
                  path_or_fileobj='config.json',
                  path_in_repo='config.json',
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              
              api.upload_file(
                  path_or_fileobj=largest_file,
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              
              if os.path.exists(youtube_name):
                  yt_size = os.path.getsize(youtube_name)
                  print(f'📤 Sending YouTube-Ready MP4 ({yt_size / (1024*1024):.2f} MB) to Hugging Face...')
                  api.upload_file(
                      path_or_fileobj=youtube_name,
                      path_in_repo=youtube_name,
                      repo_id=repo_id,
                      repo_type='dataset',
                      token=token
                  )
                  print('✅ Done! Both files uploaded successfully.')
                  os.remove(youtube_name)
              else:
                  print('⚠️ YouTube file creation failed, but original video was uploaded.')
              
              os.remove(largest_file)
              os.remove('config.json')
              
          else:
              print('❌ Error: No files found! Download might have failed.')
              exit(1)
          EOF
          
          python3 upload.py
